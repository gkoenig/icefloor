name: security

# Every push (branches and release tags) and every PR, independent of the release flow.
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
