[project]
name = "icefloor"
version = "0.1.0"
description = "Terminal UI for inspecting Iceberg table and Parquet file metadata"
readme = "README.md"
authors = [
    { name = "Gerd Koenig", email = "koenig.bodensee@googlemail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["iceberg", "parquet", "tui", "metadata", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "pyarrow>=25.0.1",
    "pyiceberg>=0.7",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/gkoenig/icefloor"
Issues = "https://github.com/gkoenig/icefloor/issues"

[project.scripts]
icefloor = "icefloor.cli:main"

[project.optional-dependencies]
sql = [
    "pyiceberg[sql-sqlite]>=0.12.0",
]
s3 = [
    "pyiceberg[s3fs]>=0.12.0",
]
glue = [
    "pyiceberg[glue]>=0.12.0",
]
azure = [
    "pyiceberg[adlfs]>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "sqlalchemy>=2.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF012: Textual's BINDINGS/CSS_PATH class attributes are lists by design.
ignore = ["B904", "RUF001", "RUF012"]
