[project]
name = "icefloor"
version = "0.1.0"
description = "Terminal UI for inspecting Iceberg table and Parquet file metadata"
readme = "README.md"
authors = [
    { name = "Gerd Koenig", email = "gerd.koenig@mobi.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.1",
    "pyiceberg>=0.7",
    "textual>=8.2.8",
]

[project.scripts]
icefloor = "icefloor.cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "sqlalchemy>=2.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF012: Textual's BINDINGS/CSS_PATH class attributes are lists by design.
ignore = ["B904", "RUF001", "RUF012"]
